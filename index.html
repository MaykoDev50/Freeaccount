<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Generator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --roblox-color: #dc2626;
      --fortnite-color: #7c3aed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 100%;
      max-width: 550px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-google {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }

    .btn-google:hover {
      background-color: #f8fafc;
    }

    .btn-roblox {
      background-color: var(--roblox-color);
      color: #ffffff;
    }

    .btn-roblox:hover {
      background-color: #b91c1c;
    }

    .btn-fortnite {
      background-color: var(--fortnite-color);
      color: #ffffff;
    }

    .btn-fortnite:hover {
      background-color: #6d28d9;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .progress-container {
      margin-top: 16px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: var(--bg-color);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent);
      transition: width 0.2s ease;
    }

    .status-text {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .results-area {
      margin-top: 24px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .results-header h3 {
      font-size: 14px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 220px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .error-msg {
      color: #ef4444;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>

  <!-- Firebase Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="container">
    <h1>Account Generator</h1>
    <p class="subtitle">Generate temporary test credentials and transmit logs</p>

    <!-- STEP 1: LOGIN -->
    <div id="login-section">
      <button class="btn btn-google" id="btn-login">
        Sign in with Google
      </button>
      <div id="login-error" class="error-msg hidden"></div>
    </div>

    <!-- STEP 2: DASHBOARD -->
    <div id="dashboard-section" class="hidden">
      <div class="user-bar">
        <span id="user-email-display">user@example.com</span>
        <button class="btn btn-secondary" id="btn-logout" style="width: auto; padding: 6px 12px; font-size: 12px;">Sign Out</button>
      </div>

      <div class="grid-2">
        <button class="btn btn-roblox" id="btn-roblox">Generate Roblox</button>
        <button class="btn btn-fortnite" id="btn-fortnite">Generate Fortnite</button>
      </div>

      <div id="progress-section" class="progress-container hidden">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="status-text" id="status-text">Initializing generation process...</div>
      </div>

      <div id="results-section" class="results-area hidden">
        <div class="results-header">
          <h3>Generated Credentials</h3>
          <button class="btn btn-secondary" id="btn-copy" style="width: auto; padding: 4px 10px; font-size: 12px;">Copy All</button>
        </div>
        <textarea id="output-text" readonly></textarea>
      </div>
    </div>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    let currentUser = null;

    // --- EMBEDDED DISCORD WEBHOOK ---
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1567937344017928333/4JAavaW2Be_d-g2kkvkp8a_YTAYvYtN86hYFrIUEEdvtZSSaWiWhtRLQrIhaxu5SwD5V";

    // --- AUTHENTICATION FLOW ---
    document.getElementById('btn-login').addEventListener('click', () => {
      auth.signInWithPopup(googleProvider).catch((error) => {
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = error.message;
        errorEl.classList.remove('hidden');
      });
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      auth.signOut();
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('user-email-display').textContent = user.email;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
      } else {
        currentUser = null;
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
      }
    });

    // --- GENERATOR LOGIC ---
    function getRandomString(length) {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    async function handleGeneration(category) {
      const btnRoblox = document.getElementById('btn-roblox');
      const btnFortnite = document.getElementById('btn-fortnite');
      const progressSection = document.getElementById('progress-section');
      const progressFill = document.getElementById('progress-fill');
      const statusText = document.getElementById('status-text');
      const resultsSection = document.getElementById('results-section');
      const outputText = document.getElementById('output-text');

      btnRoblox.disabled = true;
      btnFortnite.disabled = true;
      resultsSection.classList.add('hidden');
      progressSection.classList.remove('hidden');
      progressFill.style.width = '0%';

      const totalAccounts = 20;
      const generatedData = [];

      for (let i = 1; i <= totalAccounts; i++) {
        const email = getRandomString(8) + '@gmail.com';
        const password = getRandomString(8);
        generatedData.push({ email, password });

        const percentage = Math.round((i / totalAccounts) * 80);
        progressFill.style.width = percentage + '%';
        statusText.textContent = `Generating account ${i} of ${totalAccounts}...`;

        await new Promise(resolve => setTimeout(resolve, 150));
      }

      statusText.textContent = 'Transmitting webhook log to Discord...';
      progressFill.style.width = '90%';

      await sendDiscordWebhook(category, generatedData);

      progressFill.style.width = '100%';
      statusText.textContent = 'Complete';

      setTimeout(() => {
        progressSection.classList.add('hidden');
        btnRoblox.disabled = false;
        btnFortnite.disabled = false;

        const formattedOutput = generatedData.map(item => `${item.email}\n${item.password}`).join('\n\n');
        outputText.value = formattedOutput;
        resultsSection.classList.remove('hidden');
      }, 400);
    }

    // --- DISCORD WEBHOOK DISPATCH ---
    async function sendDiscordWebhook(category, accounts) {
      if (!DISCORD_WEBHOOK_URL) return;

      const formattedList = accounts.map(item => `${item.email}\n${item.password}`).join('\n\n');

      const payload = {
        embeds: [{
          title: `Account Request: ${category.toUpperCase()}`,
          color: category === 'roblox' ? 14431782 : 8141549,
          fields: [
            { name: "User", value: currentUser ? currentUser.email : "Unknown", inline: true },
            { name: "Category", value: category, inline: true },
            { name: "Generated Accounts (20)", value: "```\n" + formattedList.substring(0, 950) + "\n```" }
          ],
          timestamp: new Date().toISOString()
        }]
      };

      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error('Webhook error:', err);
      }
    }

    document.getElementById('btn-roblox').addEventListener('click', () => handleGeneration('roblox'));
    document.getElementById('btn-fortnite').addEventListener('click', () => handleGeneration('fortnite'));

    document.getElementById('btn-copy').addEventListener('click', () => {
      const outputText = document.getElementById('output-text');
      outputText.select();
      navigator.clipboard.writeText(outputText.value);
    });
  </script>
</body>
</html>
